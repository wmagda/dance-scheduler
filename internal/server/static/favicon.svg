<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e2436"/>
      <stop offset="100%" stop-color="#0f1117"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#2c3347" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#ring)" stroke-width="2.5" opacity="0.9"/>
  <!-- Follower (rose) silhouette -->
  <circle cx="25" cy="19" r="3.6" fill="url(#rose)"/>
  <path d="M21 25 C 23 23, 27 23, 29 26 L 31 35 C 27 38, 20 39, 17 36 C 18 31, 20 28, 21 25 Z" fill="url(#rose)"/>
  <path d="M23 36 L 20 48 M 27 36 L 29 47" stroke="url(#rose)" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Lead (amber) silhouette -->
  <circle cx="38" cy="17.5" r="3.6" fill="url(#amber)"/>
  <path d="M34 23.5 C 36 22, 41 22, 42.5 25 L 41 36 L 34 35.5 Z" fill="url(#amber)"/>
  <path d="M35.5 35.5 L 34 48 M 39.5 35.5 L 42 48" stroke="url(#amber)" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Connected dance frame arms -->
  <path d="M27 25 Q 32 19 36 24" fill="none" stroke="#fde68a" stroke-width="2.2" stroke-linecap="round"/>
