<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e2436"/>
      <stop offset="100%" stop-color="#0f1117"/>
    </linearGradient>
    <linearGradient id="skirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="55%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Rounded dark card -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#2c3347" stroke-width="2"/>

  <!-- Subtle warm spotlight / spin arc -->
  <path d="M13 47 C 21 56, 44 56, 52 46" fill="none" stroke="url(#gold)" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>
  <circle cx="49" cy="16" r="2.2" fill="#fcd34d"/>
  <path d="M16 17 L17.2 13.8 L18.4 17 L21.6 18.2 L18.4 19.4 L17.2 22.6 L16 19.4 L12.8 18.2 Z" fill="#f59e0b" opacity="0.9"/>

  <!-- Stylized Latin dancer mid-turn -->
  <!-- Head -->
  <circle cx="33.5" cy="14.5" r="4.3" fill="url(#gold)"/>
  <!-- Raised turn arm & partner-frame arm -->
  <path d="M31 21 C 25 17, 23 11.5, 27.5 8.5" fill="none" stroke="#f8fafc" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M35 21.5 C 41 22.5, 45.5 20, 48.5 16.5" fill="none" stroke="#f8fafc" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Bodice -->
  <path d="M29.5 19.5 L36.5 20 L35 29.5 L29.5 29 Z" fill="#f43f5e"/>
  <!-- Flowing flared salsa/bachata skirt -->
  <path d="M29.5 28.5 C 22 32, 16.5 38.5, 18.5 43.5 C 24 41.5, 28.5 44.5, 34 43 C 39.5 41.5, 44.5 43.5, 47.5 39.5 C 45.5 34, 40 30.5, 35 28.8 Z" fill="url(#skirt)"/>
  <!-- Gold waist sash highlight -->
  <path d="M29.3 28.8 Q 32.3 30.2 35.3 29" fill="none" stroke="#fcd34d" stroke-width="2" stroke-linecap="round"/>
  <!-- Legs in cross-body / turn step -->
  <path d="M30.5 42.5 L27.5 52.5" fill="none" stroke="#f8fafc" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M35.5 42 L40.5 51" fill="none" stroke="#f8fafc" stroke-width="2.8" stroke-linecap="round"/>
</svg>
